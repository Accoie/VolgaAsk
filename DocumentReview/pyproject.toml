[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "volgaask-document-review"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["python-docx>=1.2,<2", "httpx>=0.27,<1", "pydantic>=2.7,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
test = ["pytest>=8,<10"]

[project.scripts]
volgaask-anonymize = "document_review.anonymize_cli:main"
volgaask-review = "document_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
