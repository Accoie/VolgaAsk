[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "volgaask-document-generator"
version = "0.1.0"
description = "Диалоговое заполнение заявлений Волгатеха"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "docxtpl>=0.20.2,<0.21",
    "jinja2>=3.1,<4",
    "pydantic>=2.7,<3",
    "python-dotenv>=1,<2",
    "snowballstemmer>=3,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
volgaask-document = "document_generator.cli:main"

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"

[tool.setuptools]
packages = [
    "document_generator",
    "document_generator.templates",
    "document_generator.dialog",
    "document_generator.rendering",
    "document_generator.llm",
    "volgaask_document_templates",
]

[tool.setuptools.package-dir]
"" = "src"
volgaask_document_templates = "document_templates"

[tool.setuptools.package-data]
volgaask_document_templates = ["*/schema.json", "*/template.docx"]
