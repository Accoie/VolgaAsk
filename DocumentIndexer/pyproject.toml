[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "volgaask-document-indexer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "docling>=2.0",
    "docling-core>=2.0",
    "pgvector>=0.2",
    "psycopg[binary]>=3.2",
    "pypdfium2>=4.30",
    "requests>=2.32",
    "sentence-transformers>=3.0",
    "sqlalchemy>=2.0",
    "transformers>=4.40",
]

[tool.setuptools]
packages = ["offline"]
py-modules = ["chunk_model", "chunker", "converter", "date_parser", "db", "encoder", "indexer", "pipeline", "portal", "settings"]
