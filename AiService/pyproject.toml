[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-service"
version = "0.1.0"
description = "RAG-сервис Волгатеха: конвертация документов, чанкинг, эмбеддинги и поиск"
requires-python = ">=3.11"
dependencies = [
    "docling>=2.0",
    "docling-core>=2.0",
    "pgvector>=0.2",
    "psycopg[binary]>=3.1",
    "sentence-transformers>=3.0",
    "sqlalchemy>=2.0",
    "transformers>=4.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
